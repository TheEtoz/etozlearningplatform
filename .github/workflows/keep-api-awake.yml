# Keep Render free-tier API awake (spins down after ~15 min idle).
name: Keep API awake

on:
  schedule:
    # Every 10 minutes — under Render's ~15 minute idle timeout.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoints
        run: |
          set -euo pipefail
          API_URL="${API_URL:-https://etoz-api.onrender.com}"
          echo "Pinging ${API_URL}/health …"
          curl -fsS --max-time 90 "${API_URL}/health"
          echo
          echo "Pinging ${API_URL}/health/db …"
          curl -fsS --max-time 90 "${API_URL}/health/db"
          echo
          echo "OK $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        env:
          API_URL: https://etoz-api.onrender.com
